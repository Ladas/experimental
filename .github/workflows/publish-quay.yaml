name: Publish Quay

# Build the exact upstream main revision without synchronizing its source into
# this fork. This is the lightweight Phase 2 bridge: source remains upstream,
# while ODH owns the Quay credentials, publication gates, and image tags.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when the immutable SHA tag already exists
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-quay-upstream-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  FEATURES: otel
  IMAGE: quay.io/opendatahub/praxis-experimental
  IMAGE_NAME: praxis-experimental
  REGISTRY: quay.io/opendatahub
  UPSTREAM_BRANCH: main
  UPSTREAM_REPOSITORY: praxis-proxy/experimental

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.source.outputs.should_build }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      upstream_sha: ${{ steps.source.outputs.upstream_sha }}
    steps:
      - name: Log in to Quay
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_USERNAME || secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Resolve immutable upstream revision
        id: source
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          upstream_sha="$(git ls-remote \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" \
            "refs/heads/${UPSTREAM_BRANCH}" | awk '{print $1}')"
          if ! [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve a full upstream commit SHA." >&2
            exit 1
          fi

          short_sha="${upstream_sha:0:12}"
          immutable_ref="${IMAGE}:sha-${short_sha}"
          should_build=true
          if [ "$FORCE_REBUILD" != "true" ] \
            && podman manifest inspect "$immutable_ref" >/dev/null 2>&1; then
            should_build=false
          fi

          {
            echo "upstream_sha=${upstream_sha}"
            echo "short_sha=${short_sha}"
            echo "should_build=${should_build}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Resolved upstream source"
            echo
            echo "- Repository: \`${UPSTREAM_REPOSITORY}\`"
            echo "- Revision: \`${upstream_sha}\`"
            echo "- Immutable tag: \`${immutable_ref}\`"
            echo "- Build required: \`${should_build}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    if: needs.resolve.outputs.should_build == 'true'
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the resolved upstream revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.upstream_sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-suffix: odh-quay-test

      - name: Test the exact publication revision
        run: make test

  build:
    if: needs.resolve.outputs.should_build == 'true'
    needs: [resolve, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - name: Check out the resolved upstream revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.upstream_sha }}
          persist-credentials: false

      - name: Build native architecture image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: sha-${{ needs.resolve.outputs.short_sha }}-${{ matrix.arch }}
          containerfiles: ./Containerfile
          context: .
          arch: ${{ matrix.arch }}
          build-args: |
            FEATURES=${{ env.FEATURES }}
            VERSION=main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.upstream_sha }}
          layers: true
          # Buildah ignores Containerfile HEALTHCHECK in OCI-format output.
          # Docker-v2 preserves it for standalone Podman/RHEL consumers.
          oci: false
          squash: false

      - name: Log in to Quay
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_USERNAME || secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Push architecture image
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Export registry digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry returned an invalid digest: ${DIGEST}" >&2
            exit 1
          fi
          digest_file="${RUNNER_TEMP}/digest-${{ matrix.arch }}"
          printf '%s\n' "$DIGEST" > "$digest_file"

      - name: Upload registry digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  smoke-amd64:
    if: needs.resolve.outputs.should_build == 'true'
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out smoke-test configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.upstream_sha }}
          persist-credentials: false

      - name: Download amd64 registry digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests

      - name: Log in to Quay
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_USERNAME || secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Resolve amd64 image digest
        id: image
        run: |
          digest="$(cat "${RUNNER_TEMP}/digests/digest-amd64")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid amd64 digest: ${digest}" >&2
            exit 1
          fi
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Start container by digest as an arbitrary UID
        run: |
          podman run --detach --name praxis-ci \
            --cap-drop all \
            --publish 8080:8080 \
            --security-opt no-new-privileges \
            --user 10001:0 \
            --volume "$GITHUB_WORKSPACE/examples/configs/minimal.yaml:/etc/praxis/praxis.yaml:ro,Z" \
            "${{ steps.image.outputs.ref }}"

      - name: Wait for the embedded Podman health check
        run: |
          for _ in $(seq 1 30); do
            if podman healthcheck run praxis-ci; then
              echo "container is healthy"
              exit 0
            fi
            sleep 2
          done
          podman inspect --format '{{json .State.Health}}' praxis-ci || true
          echo "timed out waiting for the embedded health check" >&2
          exit 1

      - name: Check readiness through an exec probe
        run: |
          for _ in $(seq 1 30); do
            if podman exec praxis-ci \
              curl --fail --silent --output /dev/null \
              http://127.0.0.1:9901/ready; then
              echo "container is ready"
              exit 0
            fi
            sleep 2
          done
          podman exec praxis-ci \
            curl --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:9901/ready || true
          echo "timed out waiting for the internal readiness endpoint" >&2
          exit 1

      - name: Check the gateway serves traffic
        run: |
          body="$(curl --fail --silent --show-error \
            http://127.0.0.1:8080/)"
          echo "$body"
          grep -q 'praxis-experimental' <<< "$body"

      - name: Container logs
        if: always()
        run: podman logs praxis-ci || true

      - name: Stop container
        if: always()
        run: podman rm --force praxis-ci || true

  publish-manifest:
    if: needs.resolve.outputs.should_build == 'true'
    needs: [resolve, build, smoke-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to Quay
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_USERNAME || secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Create and publish multi-architecture manifest
        env:
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
        run: |
          manifest="localhost/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          buildah manifest create "$manifest"

          for arch in amd64 arm64; do
            digest="$(cat "${RUNNER_TEMP}/digests/digest-${arch}")"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid ${arch} digest: ${digest}" >&2
              exit 1
            fi
            buildah manifest add "$manifest" "docker://${IMAGE}@${digest}"
          done

          buildah manifest inspect "$manifest"
          buildah manifest push --all --format v2s2 "$manifest" \
            "docker://${IMAGE}:sha-${SHORT_SHA}"
          buildah manifest push --all --format v2s2 "$manifest" \
            "docker://${IMAGE}:main"
          podman manifest inspect "${IMAGE}:sha-${SHORT_SHA}"

          {
            echo "## Published image"
            echo
            echo "- \`${IMAGE}:main\`"
            echo "- \`${IMAGE}:sha-${SHORT_SHA}\`"
            echo "- Upstream revision: \`${UPSTREAM_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
